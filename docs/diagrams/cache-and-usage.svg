<text x="122" y="255.6" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#142C44">1  Expansion cache hit</text>
<text x="122" y="299.2" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#142C44">Reuse original + 2 alternatives</text>
<rect x="1060" y="210" width="760" height="130" rx="18" fill="#E9E5F7"/>
<text x="1082" y="255.6" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#142C44">No Gemini request</text>
<text x="1082" y="299.2" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#142C44">attempted = false; calls = 0</text>
<polyline points="840,465 1060,465" fill="none" stroke="#60788F" stroke-width="4" stroke-linejoin="round"/>
<polygon points="1060.0,465.0 1046.5,471.5 1046.5,458.5" fill="#60788F"/>
<polyline points="470,530 470,590" fill="none" stroke="#60788F" stroke-width="4" stroke-linejoin="round"/>
<polygon points="470.0,590.0 463.5,576.5 476.5,576.5" fill="#60788F"/>
<rect x="100" y="400" width="740" height="130" rx="18" fill="#DDF3ED"/>
<text x="122" y="445.6" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#142C44">2  Three dense searches</text>
<text x="122" y="489.2" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#142C44">Pinecone retrieves evidence again</text>
