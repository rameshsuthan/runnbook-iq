<text x="1082" y="825.6" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#142C44">No Gemini request</text>
<text x="1082" y="869.2" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#142C44">New chat usage = 0; prior usage not repeated</text>
<text x="64" y="1029.2" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#40576D">Chat usage and Pinecone units are separate. Null can mean not applicable or unreported; status supplies the context.</text>
