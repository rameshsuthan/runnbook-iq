<text x="1082" y="445.6" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#142C44">Pinecone consumption</text>
<text x="1082" y="489.2" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#142C44">41 embedding tokens; 3 read units</text>
<polyline points="840,655 1060,655" fill="none" stroke="#60788F" stroke-width="4" stroke-linejoin="round"/>
<polygon points="1060.0,655.0 1046.5,661.5 1046.5,648.5" fill="#60788F"/>
<polyline points="470,720 470,780" fill="none" stroke="#60788F" stroke-width="4" stroke-linejoin="round"/>
