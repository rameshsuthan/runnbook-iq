<text x="64" y="135.8" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#40576D">A recorded cache-hit example supplied by the user; no additional API calls were made to create this visual</text>
<polyline points="840,275 1060,275" fill="none" stroke="#60788F" stroke-width="4" stroke-linejoin="round"/>
