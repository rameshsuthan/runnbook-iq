<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img"><title>RunbookIQ | Why zero chat tokens can still mean work</title><desc>A recorded cache-hit example supplied by the user; no additional API calls were made to create this visual</desc><rect width="1920" height="1080" fill="#F7F9FC"/>
