<text x="122" y="635.6" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#142C44">3  One reranking request</text>
<text x="122" y="679.2" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#142C44">Select the most relevant evidence</text>
<rect x="1060" y="590" width="760" height="130" rx="18" fill="#E9E5F7"/>
<text x="1082" y="635.6" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#142C44">Pinecone consumption</text>
<text x="1082" y="679.2" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#142C44">1 rerank unit</text>
<polyline points="840,845 1060,845" fill="none" stroke="#60788F" stroke-width="4" stroke-linejoin="round"/>
