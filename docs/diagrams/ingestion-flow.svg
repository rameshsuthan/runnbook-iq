<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img"><title>RunbookIQ | Ingestion and publication</title><desc>A separate explicit command path; ordinary questions never rebuild or re-embed the corpus</desc><rect width="1920" height="1080" fill="#F7F9FC"/>
<text x="64" y="88.0" font-family="Arial, DejaVu Sans, sans-serif" font-size="50" font-weight="700" fill="#142C44">RunbookIQ | Ingestion and publication</text>
<text x="64" y="135.8" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#40576D">A separate explicit command path; ordinary questions never rebuild or re-embed the corpus</text>
<polyline points="570,330 720,330" fill="none" stroke="#60788F" stroke-width="4" stroke-linejoin="round"/>
<polygon points="720.0,330.0 706.5,336.5 706.5,323.5" fill="#60788F"/>
