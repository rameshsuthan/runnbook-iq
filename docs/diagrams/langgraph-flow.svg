<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img"><title>RunbookIQ | The bounded question workflow</title><desc>Simplified recording view; architecture.md contains every terminal branch and retrieval-only exit</desc><rect width="1920" height="1080" fill="#F7F9FC"/>
<text x="64" y="88.0" font-family="Arial, DejaVu Sans, sans-serif" font-size="50" font-weight="700" fill="#142C44">RunbookIQ | The bounded question workflow</text>
<text x="64" y="135.8" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#40576D">Simplified recording view; architecture.md contains every terminal branch and retrieval-only exit</text>
<polyline points="330,350 330,440" fill="none" stroke="#60788F" stroke-width="4" stroke-linejoin="round"/>
