<text x="92" y="409.2" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#142C44">Original is retained</text>
<text x="92" y="445.4" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#142C44">0–2 guarded alternatives</text>
<text x="92" y="483.2" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#142C44">At most 3 queries</text>
<rect x="550" y="210" width="400" height="180" rx="18" fill="#DDF3ED"/>
<text x="572" y="254.8" font-family="Arial, DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#142C44">Pinecone dense search</text>
<text x="572" y="299.2" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#142C44">Up to 5 hits per query</text>
<text x="572" y="336.2" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#142C44">Semantic similarity</text>
<text x="572" y="373.2" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#142C44">Canonical text checked</text>
<rect x="550" y="590" width="400" height="180" rx="18" fill="#E8F0FA"/>
<text x="572" y="635.6" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#142C44">Local BM25</text>
<text x="572" y="679.2" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#142C44">Up to 5 hits per query</text>
<text x="572" y="716.2" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#142C44">Exact identifiers + terms</text>
<text x="572" y="753.2" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#142C44">Explicit filters before top-k</text>
