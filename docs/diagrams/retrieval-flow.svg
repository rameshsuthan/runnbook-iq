<text x="1532" y="825.6" font-family="Arial, DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#142C44">Selected evidence</text>
<text x="1532" y="869.2" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#142C44">Up to 5 chunks</text>
<text x="1532" y="906.2" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#142C44">Canonical citations</text>
<text x="80" y="897.2" font-family="Arial, DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#142C44">RRF score = sum of 1 / (60 + original rank)</text>
<text x="80" y="946.6" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#142C44">Single-list dense mode preserves order; reranking is independently optional.</text>
<text x="64" y="1029.2" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#40576D">Relevance scores are not confidence percentages. Good retrieval does not guarantee a supported answer.</text>
